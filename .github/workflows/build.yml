name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip notif.zip (if present)
        run: |
          if [ -f notif.zip ]; then
            mkdir -p _src
            unzip -oq notif.zip -d _src
          fi

      - name: Find project root
        id: root
        run: |
          f=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$f" ]; then echo "settings.gradle.kts not found"; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Island-debug-apk
          path: ${{ steps.root.outputs.dir }}/app/build/outputs/apk/debug/*.apk
